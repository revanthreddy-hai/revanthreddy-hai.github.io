<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Books R R Airre has read and is currently reading.">
  <meta name="theme-color" content="#f6f5f0">
  <title>Books — R R Airre</title>
  <link rel="stylesheet" href="styles.css">
  <script src="assets/books.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="index.html">R R Airre</a>
      <a class="quiet-link" href="index.html">Home</a>
    </header>

    <main class="page books-page">
      <h1>Books</h1>

      <div class="shelf-toolbar">
        <div class="shelf-switcher" aria-label="Choose a bookshelf">
          <button class="shelf-tab" id="read-tab" type="button" aria-controls="read-panel" aria-pressed="true" data-shelf="read">
            Read <span id="read-count"></span>
          </button>
          <button class="shelf-tab" id="current-tab" type="button" aria-controls="current-panel" aria-pressed="false" data-shelf="current">
            Currently reading <span id="current-count"></span>
          </button>
        </div>
        <p class="source-note" id="books-source"><a href="https://www.goodreads.com/user/show/40542943-revan">Goodreads ↗</a></p>
      </div>

      <section class="shelf-panel" id="read-panel" aria-labelledby="read-tab">
        <h2 class="visually-hidden">Read books</h2>
        <p class="shelf-message" id="read-message" aria-live="polite">Loading books…</p>
        <div class="shelf-groups" id="read-shelf" hidden></div>
      </section>

      <section class="shelf-panel" id="current-panel" aria-labelledby="current-tab" hidden>
        <h2 class="visually-hidden">Currently reading books</h2>
        <p class="shelf-message" id="current-message" aria-live="polite">Loading books…</p>
        <ul class="cover-grid" id="current-shelf" hidden></ul>
      </section>

      <noscript><p class="shelf-message">JavaScript is needed to display the Goodreads shelves.</p></noscript>
    </main>
  </div>
</body>
</html>
