name: Sync Goodreads shelves

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-goodreads
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Refresh the shelf
        run: python scripts/sync_goodreads.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/books.json; then
            echo "The shelf is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          git commit -m "Update Goodreads shelf"
          git push
